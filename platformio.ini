; ===== Jmouse HzPro - PlatformIO Configuration =====
; Build with: pio run -e esp32dev     (Classic ESP32 - Bluetooth)
;             pio run -e esp32s2      (ESP32-S2 - USB HID)
;             pio run -e esp32s3_ble  (ESP32-S3 - Bluetooth)
;             pio run -e esp32s3_usb  (ESP32-S3 - USB HID)

[common]
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git

; ===== ESP32 Classic (BLE Mouse) =====
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.partitions = ${common.board_build.partitions}
build_flags = -DHAS_BLE=1 -DHAS_USB_HID=0 -DUSE_NIMBLE
lib_deps =
    ${common.lib_deps}
    h2zero/NimBLE-Arduino@^1.4.1
    https://github.com/Kopunk/ESP32-BLE-Combo.git

; ===== ESP32-S2 (USB HID Mouse — no Bluetooth) =====
[env:esp32s2]
platform = espressif32
board = esp32-s2-saola-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.partitions = ${common.board_build.partitions}
build_flags = -DARDUINO_USB_MODE=0 -DARDUINO_USB_CDC_ON_BOOT=1 -DHAS_BLE=0 -DHAS_USB_HID=1
lib_deps =
    ${common.lib_deps}

; ===== ESP32-S3 with BLE (default) =====
[env:esp32s3_ble]
platform = espressif32
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.partitions = ${common.board_build.partitions}
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DHAS_BLE=1 -DHAS_USB_HID=1 -DUSE_NIMBLE
lib_deps =
    ${common.lib_deps}
    h2zero/NimBLE-Arduino@^1.4.1
    https://github.com/Kopunk/ESP32-BLE-Combo.git

; ===== ESP32-S3 with USB HID =====
[env:esp32s3_usb]
platform = espressif32
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.partitions = ${common.board_build.partitions}
build_flags = -DFORCE_USB_MODE=1 -DARDUINO_USB_MODE=0 -DARDUINO_USB_CDC_ON_BOOT=1 -DHAS_BLE=0 -DHAS_USB_HID=1
lib_deps =
    ${common.lib_deps}
